name: Bug
description: Something broken found in manual or automated testing
title: "[bug] "
labels: ["bug", "type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        File bugs during test passes. Agent fixes, pushes `main`, redeploys if user-facing.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - live-practice
        - routine-video
        - admin
        - deploy
        - pose-overlay
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: URL, routine, browser…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
