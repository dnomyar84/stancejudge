name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  # Never cancel mid-deploy — a half-pushed gh-pages branch breaks asset URLs.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run generate-canonical
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_YOUTUBE_PROXY: ${{ vars.YOUTUBE_PROXY_URL }}

      - run: node scripts/verify-pages-export.mjs

      - name: Push static export to gh-pages branch
        run: |
          short="${GITHUB_SHA::7}"
          cd out
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Deploy ${short}"
          git branch -M gh-pages
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
